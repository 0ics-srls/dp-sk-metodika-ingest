[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "tests"]
markers = [
    "unit: hermetic unit test (runs in the image build)",
    "integration: needs Docker (Postgres + pgvector); excluded from the image build",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests"
explicit_package_bases = true

[tool.ruff]
line-length = 160
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001", "T201", "S101", "ANN401", "CPY001", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.per-file-ignores]
"src/dp_sk_metodika_ingest/repository.py" = ["S608"]  # column names are module constants, values are bound parameters
"tests/**" = ["PLR0913", "PLR0917", "FBT001", "S608", "TC003", "PLR2004", "INP001", "E501", "SLF001", "S105", "S106"]
